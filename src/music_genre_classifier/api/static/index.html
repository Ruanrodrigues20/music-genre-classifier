<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Classificador Musical</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: #fff;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #111827;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin-bottom: 15px;
            width: 100%;
        }

        button {
            background: #4f46e5;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #6366f1;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Classificador de Gênero Musical</h1>

        <form id="form">
            <input type="file" id="file" accept=".wav,.mp3" required>
            <button type="submit">Classificar</button>
        </form>

        <p id="result"></p>
    </div>

    <script>
        const form = document.getElementById("form");
        const fileInput = document.getElementById("file");
        const result = document.getElementById("result");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                result.textContent = "Selecione um arquivo primeiro.";
                return;
            }

            // Simulação de classificação
            const generos = ["Rock", "Pop", "MPB", "Forró", "Jazz", "Clássico", "Hip Hop"];
            const generoAleatorio = generos[Math.floor(Math.random() * generos.length)];

            result.textContent = `🎧 Arquivo "${file.name}" classificado como: ${generoAleatorio}`;
        });
    </script>
</body>
</html>
